plugins {
    id 'com.android.application' version '7.4.2'
}

android {
    namespace 'com.kedaimusik.app'
    compileSdk 33

    defaultConfig {
        applicationId 'com.kedaimusik.app'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Use the debug signing config so the APK is directly installable
            // from the GitHub Actions artifact without a private keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}