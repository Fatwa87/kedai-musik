name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://fatwaloebis:$HF_TOKEN@huggingface.co/spaces/fatwaloebis/kedai-musik main
          else
            echo "HF_TOKEN secret is not set, skipping automatic sync."
          fi

